spring:
  application:
    name: erp-ai-assistant
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:config/liquibase/master.xml
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen2.5:7b}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:bge-m3}
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
        missing-queues-fatal: false
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:erpai}
    password: ${RABBITMQ_PASSWORD:erpai_dev}
  http:
    client:
      connect-timeout: 3s
      read-timeout: 60s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: when-authorized

app:
  db:
    url: jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:erpai}
    username: ${APP_DB_USER:erpai}
    password: ${APP_DB_PASSWORD:erpai_dev}
  erp:
    db:
      url: ${ERP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=erp;encrypt=true;trustServerCertificate=true}
      username: ${ERP_DB_USER:erp_readonly}
      password: ${ERP_DB_PASSWORD:}
    default-company-id: ${ERP_DEFAULT_COMPANY_ID:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
      refresh-ttl-days: 7
  ai:
    provider: ${AI_PROVIDER:ollama}
    vision-model: ${AI_VISION_MODEL:qwen2.5vl:7b}
  storage:
    dir: ${APP_STORAGE_DIR:./data/uploads}
  rag:
    min-score: 0.3
    max-chunk-tokens: 512
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: 32
    candidates: 20
    top-k: 5
    reranker-base-url: ${RERANKER_BASE_URL:http://localhost:8081}
  entry:
    min-confidence: 0.7
  agent:
    max-steps: 6
    history-window: 10
